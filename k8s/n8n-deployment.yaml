apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-automation
  namespace: default
  labels:
    app: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
      - name: n8n
        image: docker.n8n.io/n8nio/n8n:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5678
          name: http
        
        env:
          - name: N8N_HOST
            value: "n8n.staysync.online"
          - name: N8N_PORT
            value: "5678"
          - name: N8N_PROTOCOL
            value: "https"
          - name: NODE_ENV
            value: "production"
          - name: WEBHOOK_URL
            value: "https://n8n.staysync.online/"
          # Security: Basic Auth for the n8n dashboard
          - name: N8N_BASIC_AUTH_ACTIVE
            value: "true"
          - name: N8N_BASIC_AUTH_USER
            value: "admin"
          - name: N8N_BASIC_AUTH_PASSWORD
            value: "StaySyncAutomation2026!"
            
        # Optional: In a true production environment, you would attach an EFS volume here
        # so n8n doesn't lose its workflows if the pod restarts. For now, we will use memory.
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: n8n-service
  namespace: default
  labels:
    app: n8n
spec:
  selector:
    app: n8n
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5678
  type: LoadBalancer
