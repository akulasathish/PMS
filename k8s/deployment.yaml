apiVersion: apps/v1
kind: Deployment
metadata:
  name: pms-frontend
  namespace: default
  labels:
    app: pms-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pms-frontend
  template:
    metadata:
      labels:
        app: pms-frontend
    spec:
      containers:
        - name: pms-frontend
          image: 401644592968.dkr.ecr.ap-south-1.amazonaws.com/pms/app:latest # Corrected region
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pms-prod-secrets
                  key: NEXT_PUBLIC_SUPABASE_URL
            - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: pms-prod-secrets
                  key: NEXT_PUBLIC_SUPABASE_ANON_KEY
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: pms-prod-secrets
                  key: SUPABASE_SERVICE_ROLE_KEY
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pms-prod-secrets
                  key: RESEND_API_KEY
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
      # This ensures pods are scheduled on Fargate
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      tolerations:
        - key: eks.amazonaws.com/fargate-profile
          operator: Exists
        - key: eks.amazonaws.com/compute-type
          value: fargate
          effect: NoSchedule
